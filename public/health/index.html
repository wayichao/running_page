<style>
:root{--ink:#1d2129;--mut:#6b7280;--line:#e5e7eb;--acc:#1d4ed8}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;background:#f6f7f9;color:var(--ink);

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

.box h1{font-size:19px;margin:0 0 6px}

 border-radius:10px;text-align:center;letter-spacing:1px;font-family:inherit}
input:focus{outline:none;border-color:var(--acc)}
button{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;color:#fff;
 background:var(--acc);border:0;border-radius:10px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
.err{color:#b91c1c;font-size:14px;margin-top:12px;min-height:20px}
.hint{font-size:12.5px;color:var(--mut);margin-top:16px;line-height:1.6}
#app{display:none}
</style></head><body>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const ki = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.it, hash:'SHA-256'},
    ki, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.d));
  return new TextDecoder().decode(pt);
}
const $ = id => document.getElementById(id);
async function submit(){
  const pw = $('pw').value.trim();
  if(!pw) return;
  $('go').disabled = true; $('go').textContent = '解密中…'; $('err').textContent = '';
  try{
    const html = await open_(pw);
    $('app').innerHTML = html;
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    try{ sessionStorage.setItem('k', pw); }catch(e){}
  }catch(e){
    $('err').textContent = '密码不对，再试一次';
    $('go').disabled = false; $('go').textContent = '打开';
    $('pw').value = ''; $('pw').focus();
  }
}
$('go').onclick = submit;
$('pw').onkeydown = e => { if(e.key === 'Enter') submit(); };
// 同一次会话内免重复输入
(async () => { try{ const k = sessionStorage.getItem('k'); if(k){ $('pw').value = k; await submit(); } }catch(e){} })();
</script></body></html>
